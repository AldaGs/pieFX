<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pieFX hexagon wheel</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Standalone preview only: a dark ground so the wheel reads the way it
         will over a comp. Under Tauri the page is transparent (styles.css). */
      body.preview {
        background: #1b1d22;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="wheel"></canvas>
    <script>
      if (!window.__TAURI__) document.body.classList.add("preview");
    </script>
    <script type="module" src="hexwheel.js"></script>
  </body>
</html>
