[package]
name = "overlay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The plug-in auto-launches "pieFX-overlay.exe" beside the .aex, so the binary
# must carry that name (the cargo default would be the package name, "overlay").
[[bin]]
name = "pieFX-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a TRANSPARENT window exist on macOS at all:
# without it WebviewWindowBuilder has no `transparent` method and the main
# window's "transparent": true is inert. It does what its name says — Apple
# would reject an App Store submission carrying it — which is no obstacle here,
# because the overlay is a helper binary launched by an AE plug-in and is not
# distributed through the App Store. On Windows the feature is a no-op.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system file picker, used ONLY from Rust (see pick_open_path). A path
# typed by hand is a path with a typo in it, and the two fields that take one -
# a .jsx script and a .ffx preset - are exactly the ones whose failure mode is
# a silent no-op at flick time rather than an error in the settings window.
#
# The frontend never calls the plugin directly, so no capability lists it: the
# dialog opens behind our own #[tauri::command], which is how every other
# privileged thing in this file already works.
tauri-plugin-dialog = "2"


# The virtual-desktop rect, read straight from Win32 (GetSystemMetrics). Tauri's
# available_monitors() reported a ROTATED display at its unrotated width — a
# portrait secondary at (-1080, 0) 1080x1920 came back as (-1920, 0) 1920x1080 —
# so the union built from it was 840px wide of the truth and the overlay mapped
# every summon onto the wrong monitor. SM_*VIRTUALSCREEN is rotation-aware and
# is the same rect the compositor itself uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
