[package]
name = "overlay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The plug-in auto-launches "pieFX-overlay.exe" beside the .aex, so the binary
# must carry that name (the cargo default would be the package name, "overlay").
[[bin]]
name = "pieFX-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a TRANSPARENT window exist on macOS at all:
# without it WebviewWindowBuilder has no `transparent` method and the main
# window's "transparent": true is inert. It does what its name says — Apple
# would reject an App Store submission carrying it — which is no obstacle here,
# because the overlay is a helper binary launched by an AE plug-in and is not
# distributed through the App Store. On Windows the feature is a no-op.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

